tion of China's tech scene for all technology enthusiasts.\",\"community\",{\"_129\":254,\"_255\":256},\"Community Connection\",\"decodeChina\",{\"_129\":257,\"_34\":258,\"_259\":260},\"DecodeChina\",\"A one-week intensive immersion into China's tech scene, occurring bi-monthly to broaden participants' understanding through:\",\"items\",{\"_261\":262,\"_263\":264,\"_265\":266},\"visits\",\"Company visits and networking\",\"courses\",\"Pandaily-designed courses\",\"workshops\",\"Workshops and cultural excursions\",\"data\",{\"_129\":269,\"_270\":271},\"Data Service\",\"pandata\",{\"_129\":272,\"_34\":273,\"_259\":274},\"Pandata\",\"A comprehensive database containing information on China's most influential tech companies, including:\",{\"_275\":276,\"_277\":278,\"_279\":280},\"overviews\",\"Company overviews\",\"biographies\",\"Executive team biographies\",\"stories\",\"Origin stories and developments\",\"byTheNumbers\",{\"_129\":283,\"_34\":284,\"_224\":285},\"By the Numbers\",\"As one of the most popular sources for the international community to learn about China, Pandaily has reached millions around the globe. Though our subscribers hail from all corners of the world, our goal is persistent: to break through the language barrier and strengthen our readers' understanding of China.\",{\"_286\":287,\"_288\":289,\"_290\":291,\"_292\":293,\"_294\":295,\"_296\":297},\"millions\",\"Millions\",\"millionsLabel\",\"Global Readers Reached\",\"weekly\",\"Weekly\",\"weeklyLabel\",\"Podcast Episodes\",\"global\",\"Global\",\"globalLabel\",\"Subscriber Community\",\"cta\",{\"_129\":300,\"_34\":301,\"_302\":303,\"_304\":305},\"Join Our Community\",\"Stay connected with China's evolving tech landscape through our comprehensive coverage and expert insights.\",\"readLatestNews\",\"Read Latest News\",\"listenToPodcast\",\"Listen to Podcast\",\"ENV\",{\"_308\":309,\"_310\":311},\"STRAPI_BASE_URL\",\"https://cms.pandaily.com\",\"GA_MEASUREMENT_ID\",\"G-FZLJC5WJDF\",\"routes/$slug\",{\"_314\":315,\"_374\":375,\"_6\":7,\"_513\":328},\"post\",{\"_316\":317,\"_129\":318,\"_319\":320,\"_321\":322,\"_323\":324,\"_325\":326,\"_327\":328,\"_329\":330,\"_331\":332,\"_333\":334,\"_6\":7,\"_335\":-5,\"_336\":-5,\"_337\":338,\"_339\":340,\"_56\":341,\"_342\":343,\"_364\":365,\"_366\":-5,\"_367\":-5,\"_368\":369,\"_370\":371,\"_372\":373},\"documentId\",\"dkc5h2fxq8opr89koh8xw8zn\",\"Alibaba's 27B XekRung Model Tops CyberGym Model Leaderboard at 88.9%\",\"slug\",\"alibaba-xekrung-27b-cybergym-model-leaderboard-88-9\",\"excerpt\",\"Alibaba Security AGI Lab's XekRung-1.5-27B-Preview, fine-tuned from Qwen3.8-27B, reached an 88.9% success rate on UC Berkeley's CyberGym Level 1 and now ranks first on the benchmark's model leaderboard.\",\"content\",\"\u003cp\u003eAlibaba's cybersecurity-focused large language model XekRung has taken first place on the model leaderboard of CyberGym, the vulnerability-reproduction benchmark maintained by researchers at UC Berkeley. The entry, listed as XekRung-1.5-27B-Preview and fine-tuned from Alibaba's open Qwen3.8-27B model, recorded an 88.9% success rate in a submission dated September 13. Chinese tech media reported the result on September 28, describing it as the first time a model from a Chinese developer has led the board.\u003c/p\u003e\\n\u003cp\u003eCyberGym contains 1,507 real vulnerabilities from 188 open-source projects, all originally found by Google's OSS-Fuzz program. In Level 1, a model receives a vulnerability description and the unpatched codebase, then must write a proof-of-concept input that triggers the bug on the vulnerable version but not on the patched one. The leaderboard separates single-model entries from agent systems that combine several models, tools or memory, and XekRung's result sits on the model track.\u003c/p\u003e\\n\u003cp\u003eOn the current model board, XekRung is ahead of Google's Gemini 3.8 Flash Cyber at 86.3%, OpenAI's GPT-5.5-Cyber at 85.6%, Zhipu AI's GLM-5.3 at 84.5% and DeepSeek-V4-Pro at 83.3%. The benchmark's maintainers note that scores are submitted by individual teams, that runs are stochastic, and that small gaps may not reflect meaningful capability differences.\u003c/p\u003e\\n\u003cp\u003eThe model comes from the Alibaba Security AGI Lab, led by Huang Longtao. According to the team's write-up, the Qwen3.8-27B base model scored 54.51% under the same setting, so post-training added 34.39 percentage points. The lab credits supervised fine-tuning on de-identified trajectories from Alibaba's own security operations, agentic reinforcement learning inside a general tool framework, rewards drawn from builds, crashes and PoC validation, and reuse of failed attempts as corrective training pairs. It says no CyberGym tasks, patches or reference PoCs were used in training. The evaluation ran on self-hosted FP8 inference with a 256K context window, no pre-installed fuzzing frameworks and network access limited to the benchmark's allowlist.\u003c/p\u003e\\n\u003cp\u003eAlibaba is also pitching efficiency. It says the 27B model is between 1/27 and 1/370 the size of comparable cyber models, which would lower the compute cost of automated vulnerability triage. XekRung weights have not been released, and Alibaba has not given a timeline for outside access, although Huang said the lab's security technology will be offered more broadly and that future versions will target adversarial intelligence, self-evolution and agentic tasks. An earlier XekRung technical report in May centered on an 8B version built on Qwen.\u003c/p\u003e\\n\u003cp\u003e\u003cstrong\u003eSEE ALSO:\u003c/strong\u003e \u003ca href=\\\"https://www.pandaily.com/zhipu-glm-5-3-release-tang-jie-sooooooon-coding-security-aug2026\\\"\u003eZhipu GLM-5.3 coding and security model\u003c/a\u003e · \u003ca href=\\\"https://www.pandaily.com/mopmonk-cybergym-ai-security-jun2026\\\"\u003eMopMonk enters CyberGym top 7\u003c/a\u003e · \u003ca href=\\\"https://www.pandaily.com/shanghai-ai-lab-atria-dawn-preview-744b-moe-agent\\\"\u003eShanghai AI Lab Atria Dawn Preview\u003c/a\u003e\u003c/p\u003e\",\"publishedDate\",\"2026-09-29T07:30:00.000Z\",\"featured\",false,\"viewCount\",0,\"readingTime\",3,\"status\",\"published\",\"originalWordPressId\",\"featuredImage\",\"featuredImageUrl\",\"https://cms-image.pandaily.com/1/alibaba_xekrung_27b_cybergym_017cc6cb29.png\",\"gallery\",[],[],\"tags\",[344,351,355,359,362],{\"_316\":345,\"_11\":346,\"_319\":347,\"_348\":349,\"_34\":350},\"d93dhsf37ni748u8e3l4tsbt\",\"Alibaba\",\"alibaba\",\"color\",\"#6366f1\",\"\",{\"_316\":352,\"_11\":353,\"_319\":354,\"_348\":349,\"_34\":350},\"xom32g2nuexjlnh0qyxo8q0a\",\"Qwen\",\"qwen\",{\"_316\":356,\"_11\":357,\"_319\":358,\"_348\":349,\"_34\":-5},\"plovqdxjouguund6hpiaj4ba\",\"AI Security\",\"ai-security\",{\"_316\":360,\"_11\":361,\"_319\":361,\"_348\":349,\"_34\":350},\"vr3id5zkpq1wsnsvnj15sh43\",\"cybersecurity\",{\"_316\":363,\"_11\":65,\"_319\":64,\"_348\":349,\"_34\":350},\"ji5tef72gjtbd7bx0er6q9jv\",\"authors\",[],\"seo\",\"externalVideo\",\"createdAt\",\"2026-09-29T07:00:02.017Z\",\"updatedAt\",\"2026-09-29T07:00:03.102Z\",\"publishedAt\",\"2026-09-29T07:00:03.225Z\",\"featuredPosts\",[376,404,435,463,486],{\"_316\":377,\"_129\":378,\"_319\":379,\"_321\":380,\"_323\":381,\"_325\":382,\"_327\":383,\"_329\":330,\"_331\":384,\"_333\":334,\"_6\":7,\"_335\":-5,\"_336\":-5,\"_337\":385,\"_56\":386,\"_342\":387,\"_364\":400,\"_366\":-5,\"_367\":-5,\"_368\":401,\"_370\":402,\"_372\":403},\"irdlcu5eaoyt70rej8jw63lt\",\"Tencent Hunyuan Releases Hy4 Preview, Ranking Among the Top Tier of Open-Source Models\",\"tencent-hunyuan-hy4-preview-open-source-aug2026\",\"On August 28, Tencent Hunyuan released and open-sourced Hy4 preview, its next-generation large language model with 770 billion total parameters and a context window exceeding 1 million tokens.\",\"\u003cp\u003eTencent Hunyuan’s Hy4 preview marks the company’s third major model release in six months, reflecting its rapid development cadence and growing strength in foundation models. With 770 billion total parameters, 49 billion activated parameters, and a context window exceeding 1 million tokens, Hy4 preview ranks among the top tier of open-source models and performs strongly across coding, office productivity, and scientific research.\u003c/p\u003e\\n\\n\u003cp\u003eThe model’s development is closely integrated with Tencent products such as WorkBuddy and CodeBuddy through a model–product co-design approach. In Tencent’s internal blind evaluation, Hy4 preview slightly outperformed GLM 5.3 and Kimi K3, reinforcing WorkBuddy’s position as a leading AI productivity agent in China.\u003c/p\u003e\\n\\n\u003cp\u003eHunyuan continues to work closely with products such as CodeBuddy and WorkBuddy to optimize the real-world user experience in productivity scenarios. In a blind evaluation conducted internally at Tencent, involving 163 experts and 203 engineering tasks, Hy4 preview achieved an average score of 2.99 out of 4, slightly outperforming GLM 5.3 (2.92/4.00) and Kimi K3 (2.94/4.00).\u003c/p\u003e\\n\\n\u003cp\u003eThis means that the combined Hunyuan–WorkBuddy experience has achieved a meaningful lead, demonstrating that Tencent AI’s model–product co-design approach has developed into a virtuous cycle.\u003c/p\u003e\\n\\n\u003cp\u003ePositioned as a model \u0026quot;built for productivity,\u0026quot; Hy4 preview has made significant progress across a wide range of real-world productivity tasks. This progress is driven by high-quality data co-developed with Tencent's leading experts in software engineering, gaming, finance, security, and other fields, as well as deep co-design with products such as WorkBuddy.\u003c/p\u003e\\n\\n\u003cp\u003eIn software engineering, the model has strengthened its ability to understand, plan, debug, and validate long-horizon development tasks, while further improving the visual quality and interactivity of front-end development.\u003c/p\u003e\\n\\n\u003cp\u003eIn office and analytical scenarios, the model demonstrates substantially better understanding of complex workplace environments and stronger financial analysis capabilities. It places particular emphasis on data analysis and cross-file collaboration, supporting the complete workflow from information processing to the delivery of documents, spreadsheets, and presentations.\u003c/p\u003e\\n\\n\u003cp\u003eIn game development, the model can generate a playable prototype directly from a one-sentence request and work proficiently with game engines. Developers can continuously refine complex game projects through multi-turn interactions.\u003c/p\u003e\\n\\n\u003cp\u003eIn scientific research, the model has significantly improved its ability to understand, reason through, and solve complex research problems, making major advances across AI R\u0026D, molecular dynamics simulation, condensed matter physics, foundational mathematics, and other domains.\u003c/p\u003e\\n\\n\u003cp\u003eNotably, Hy4 preview contributed meaningfully throughout its own end-to-end development process, participating for the first time in the automated optimization of training methods, data strategies, evaluation systems, and low-level operators. The model proposed approaches, ran experiments, and iterated based on the results. Code, logs, and feedback generated by those experiments were then fed into subsequent rounds of exploration, forming an initial closed loop of recursive self-improvement.\u003c/p\u003e\\n\\n\u003cp\u003eHy4 preview also independently analyzed bottlenecks in the inference system and carried out multiple rounds of optimization in areas such as operator fusion and communication efficiency. These efforts increased end-to-end throughput by 31.8% over the baseline, with consistent gains across different context lengths and concurrency levels—an early demonstration of the model's ability to autonomously optimize inference infrastructure.\u003c/p\u003e\\n\\n\u003cp\u003eHy4 preview is now open source and has launched simultaneously across Tencent products, including the Chinese and international versions of WorkBuddy and CodeBuddy, Yuanbao, and ima. Users can experience the model directly through these products or access its API through Tencent Cloud TokenHub and OpenRouter. Hy4 preview continues to follow an accessible, cost-effective pricing strategy: $0.834 per million input tokens, $2.501 per million output tokens, and $0.042 per million tokens for cache hits.\u003c/p\u003e\\n\\n\u003cp\u003eSince its launch in early March 2026, WorkBuddy has maintained a rapid pace of iteration, continuously improving its user experience and earning recognition from a wide range of individual and enterprise users. According to Tencent’s Q1 2026 earnings report, WorkBuddy has become China’s most popular AI productivity agent service by daily active accounts.\u003c/p\u003e\\n\\n\u003cp\u003eSince rebuilding its infrastructure in February, Tencent Hunyuan has released a major model iteration approximately every two months. By launching a preview first and following with a full release, Hunyuan continuously incorporates real-world feedback into the development process, allowing the model to improve by solving practical problems. Following this cadence, the next version of Hy4 will begin rolling out in the near future.\u003c/p\u003e\\n\\n\u003cp\u003eWith its model capabilities now substantially strengthened, Tencent has further consolidated WorkBuddy’s position as China’s answer to Codex, securing an early lead in the rapidly evolving AI landscape.\u003c/p\u003e\",\"2026-08-28T07:32:03.000Z\",true,4,\"https://cms-image.pandaily.com/1/hy4_preview_f6d614fd20.png\",[],[388,392,396],{\"_316\":389,\"_11\":390,\"_319\":391,\"_348\":349,\"_34\":-5},\"syz0qnsnjbckhahijkip6evy\",\"Tencent Hunyuan\",\"tencent-hunyuan\",{\"_316\":393,\"_11\":394,\"_319\":395,\"_348\":349,\"_34\":-5},\"hjttfsav6py7zihu7gbxd9qc\",\"Hy4\",\"hy4\",{\"_316\":397,\"_11\":398,\"_319\":399,\"_348\":349,\"_34\":-5},\"wbp115vvzeffpp45oh695q2z\",\"Large Language Model\",\"large-language-model\",[],\"2026-08-28T07:32:03.648Z\",\"2026-08-28T08:07:01.175Z\",\"2026-08-28T08:07:01.243Z\",{\"_316\":405,\"_129\":406,\"_319\":407,\"_321\":408,\"_323\":409,\"_325\":410,\"_327\":383,\"_329\":330,\"_331\":411,\"_333\":334,\"_6\":7,\"_335\":-5,\"_336\":-5,\"_337\":412,\"_56\":413,\"_342\":417,\"_364\":431,\"_366\":-5,\"_367\":-5,\"_368\":432,\"_370\":433,\"_372\":434},\"pb5pdb1fuswjlrh8od5anrwd\",\"WorkBuddy Goes to Work at Shanghai Jahwa: 9 Departments, 4.5x Average Efficiency\",\"workbuddy-shanghai-jahwa\",\"Tencent's office agent WorkBuddy has scaled from pilot to production inside century-old cosmetics maker Shanghai Jahwa, lifting efficiency more than fourfold across nine departments.\",\"\u003cp\u003eA century-old Chinese cosmetics maker has become a proving ground for enterprise AI agents. In April, Tencent Smart Retail, together with Shanghai Jahwa's IT and HR teams, launched a pilot of WorkBuddy, the Tencent AI office agent. Months later the deployment has scaled into routine production: WorkBuddy now covers nine business departments — spanning supply chain, brand marketing, R\u0026D, finance, HR and IT — and lifts average employee efficiency by more than 4.5 times.\u003c/p\u003e\\n\u003cp\u003eUsage data over the past month shows it is no longer just drafting documents and slides. About 67% of users apply WorkBuddy to specialized vertical work, 63% to data processing and analysis, and 57% to automation and operations. R\u0026D teams use it for cosmetics formulations and regulatory research; finance automates reimbursement-review rules and drafts investment screening reports; HR flags pending probation reviews; supply chain keeps shop-floor dashboards updated daily; marketing taps it for consumer insight and content generation.\u003c/p\u003e\\n\u003cp\u003eA supply-chain case illustrates the depth. Jahwa's B2C business spans Tmall, JD and Douyin, with warehouse, handling and delivery costs scattered across seven bill types totaling about 60 million rows over 18 months. The logistics team once wrestled this with spreadsheets, each monthly review taking five to six person-days. Its operations manager, an economics graduate who does not code, broke the process into steps for WorkBuddy to generate Python scripts, validated them against 18 months of history, and packaged what worked into reusable skills. Monthly bill analysis shrank from two person-days to 15 minutes, one visualization to three minutes, and the whole monthly cycle to under 20 minutes — with a single task up to 150 times faster.\u003c/p\u003e\\n\u003cp\u003eThe habit is spreading through workplace culture. Employees share skills so a flow a department masters can be reused elsewhere, and one team launched a 70% conversion of weekly PPT reviews into HTML pages that the whole company can view. For Tencent, the case underlines a broader pitch: enterprise agents earn their keep not by replacing jobs, but by letting domain workers — no coding required — hand off the drudgery and turn their own workflows into products.\u003c/p\u003e\",\"2026-08-28T00:00:00.000Z\",2,\"https://cms-image.pandaily.com/1/A5_c6062cab44.png\",[414],{\"_316\":415,\"_11\":65,\"_319\":64,\"_348\":416,\"_34\":350},\"ou7tkn9cq6eba9jr68hqiwch\",\"#000000\",[418,422,426],{\"_316\":419,\"_11\":420,\"_319\":421,\"_348\":349,\"_34\":-5},\"ppf1i9imlnsp5i6ayv9byk4l\",\"WorkBuddy\",\"work-buddy\",{\"_316\":423,\"_11\":424,\"_319\":425,\"_348\":349,\"_34\":350},\"njwm066t5dgnkyahw9o23jvu\",\"Tencent\",\"tencent\",{\"_316\":427,\"_11\":428,\"_319\":429,\"_348\":349,\"_34\":430},\"ubu5kkvaf94arl01l82x96wt\",\"AIAgent\",\"ai-agent\",\"Artificial intelligence systems designed to perceive their environment, make decisions, and take actions autonomously to achieve specific goals.\",[],\"2026-08-28T01:48:44.596Z\",\"2026-08-28T01:49:04.868Z\",\"2026-08-28T01:49:04.903Z\",{\"_316\":436,\"_129\":437,\"_319\":438,\"_321\":439,\"_323\":440,\"_325\":410,\"_327\":383,\"_329\":330,\"_331\":411,\"_333\":334,\"_6\":7,\"_335\":-5,\"_336\":-5,\"_337\":441,\"_56\":442,\"_342\":447,\"_364\":459,\"_366\":-5,\"_367\":-5,\"_368\":460,\"_370\":461,\"_372\":462},\"tro4f6kqnxy67xhnddulnbs7\",\"Hong Kong Re-Optimizes for Space: From China's Forgotten Launch Pioneer to a New Science Hub\",\"hong-kong-space-science-pioneer\",\"Once China's earliest commercial-satellite pioneer, Hong Kong is burnishing a quieter space story through its universities — even as the gap from science to commerce persists.\",\"\u003cp\u003eFew recaller sees Hong Kong as a space hub, yet in 1990 it stood at the front of China's commercial space ascent. On April 7 of that year, a Long March 3 rocket launched from Xichang carrying the AsiaSat-1 communications satellite into transfer orbit — China's first international commercial launch, executed on behalf of Hong Kong's AsiaSat, the region's first commercial satellite company. Long March rockets soon held about 10% of the global commercial launch market. A second Hong Kong operator, APT Satellite, followed into geostationary orbit. Then the momentum stalled, and the satellite dishes on the Tai Po waterfront became a quiet monument to that early surge.\u003c/p\u003e\\n\u003cp\u003eToday the driving force is Hong Kong's universities, whose space science punches well above the city's size. The Hong Kong Polytechnic University has spent decades on lunar and deep-space payloads — sampling mechanisms for the Chang'e-5 and Chang'e-6 missions, camera-pointing systems for Chang'e-3 and -4 and a landing-monitoring camera for the Tianwen-1 Mars probe. The Hong Kong University of Science and Technology sent the MUSICO greenhouse-gas imager to China's space station in 2026, where the first Hong Kong astronaut operates it; it also built the city's first self-developed satellite, Hsiung-bing One. The University of Hong Kong has contributed a lobster-eye X-ray satellite and an instrument for the Chang'e-7 lunar mission, while the Chinese University of Hong Kong has launched two AI remote-sensing satellites that run an LLM on board for real-time image inference.\u003c/p\u003e\\n\u003cp\u003eWhat once linked these threads is missing: commercialization. Apart from AsiaSat and APT Satellite, no third sustainable Hong Kong space company has emerged. Decades of de-industrialization, a thin aerospace industrial base and a regulatory bias toward oversight over incentives all held back would-be ventures, including ambitious satellite and constellation plans.\u003c/p\u003e\\n\u003cp\u003eHong Kong's advantages are those no other Chinese city can copy: a deep research base, mature international capital markets, common-law commercial rules, global talent and a unique window linking mainland China to the world. Commentators argue hardware manufacturing need not be its answer — research-and-design output, international partnerships and cross-border licensing could be. Whether Hong Kong can convert its forgotten pioneering start into a renewed space economy is now the open question.\u003c/p\u003e\",\"https://cms-image.pandaily.com/1/A4_3188020f29.png\",[443],{\"_316\":444,\"_11\":445,\"_319\":446,\"_348\":416,\"_34\":-5},\"nd7u5jlcbw44fqibmzu4ckhw\",\"Technology\",\"technology\",[448,452,455],{\"_316\":449,\"_11\":450,\"_319\":451,\"_348\":349,\"_34\":350},\"zznmw6zy2dhae9mn0ct3oyr6\",\"Hong Kong\",\"hong-kong\",{\"_316\":453,\"_11\":454,\"_319\":454,\"_348\":349,\"_34\":350},\"u4tbgkcmbtzt3w63dugkjddy\",\"aerospace\",{\"_316\":456,\"_11\":457,\"_319\":458,\"_348\":349,\"_34\":350},\"j45fwu61bg7hx57fo10s37oq\",\"China\",\"china\",[],\"2026-08-28T01:48:43.659Z\",\"2026-08-28T01:49:04.060Z\",\"2026-08-28T01:49:04.094Z\",{\"_316\":464,\"_129\":465,\"_319\":466,\"_321\":467,\"_323\":468,\"_325\":410,\"_327\":383,\"_329\":330,\"_331\":411,\"_333\":334,\"_6\":7,\"_335\":-5,\"_336\":-5,\"_337\":469,\"_56\":470,\"_342\":472,\"_364\":482,\"_366\":-5,\"_367\":-5,\"_368\":483,\"_370\":484,\"_372\":485},\"rt2jkwz0tuqvhpi7fvrg8o8e\",\"Baidu's Dazi Becomes Fastest-Growing Office AI Agent on an 'Application-Driven' ERNIE Bet\",\"baidu-dazi-office-agent\",\"Baidu's office agent Dazi posted the fastest desktop growth among AI work assistants in July as the company doubles down on an application-driven ERNIE strategy.\",\"\u003cp\u003eChina's office-AI market is turning into an all-out product war, and Baidu's Dazi has emerged as the fastest riser. According to the AICPB July ranking, Dazi reached 6.74 million monthly active users on desktop, second only to Tencent's WorkBuddy at 11.15 million, but with month-over-month growth of 1,063.79% — the fastest of any office AI agent.\u003c/p\u003e\\n\u003cp\u003eBaidu disclosed at its August 27 product release that Dazi users grew nearly ninefold in the past month. Since launching in March, the agent has iterated roughly 150 times, at times shipping nearly a release a day. The enterprise edition now bundles 15 suites and 96 skills spanning finance, legal, product and R\u0026D, operations and HR. Daily questions since launch have grown 60-fold, and website visits rose 845% month over month in July.\u003c/p\u003e\\n\u003cp\u003eThe company frames Dazi's edge as organizational rather than purely algorithmic. Executive vice president Shen Dou argued a good agent must not only be a smarter model, but know the user better and marshal tools and professional methods. Dazi leans on Baidu's full-stack AI cloud and its ability to customize delivery, an advantage its competitors—Tencent's communication- and document-leaning WorkBuddy and Alibaba's team-collaboration-focused Qwen—replicate less easily.\u003c/p\u003e\\n\u003cp\u003eBehind the product is a broader strategic tilt from chairman Robin Li. At the June AIDAY he proposed 'DAA' (daily active agents) as a new measure of AI value — counting how many agents actually complete tasks every day rather than tokens consumed. In August he spelled out an 'application-driven' course for ERNIE: reinforcement from the real apps that matter most, including AI search, digital humans, Miaoda, Famou and Dazi.\u003c/p\u003e\\n\u003cp\u003eThe bet is a self-reinforcing loop: real products tell the model what capability matters, the model optimizes those tasks, adoption rises, and new usage data feeds the next round. As features converge across the industry, Baidu is wagering that whoever runs this application-driven flywheel deepest will be the office AI leader that users actually keep.\u003c/p\u003e\",\"https://cms-image.pandaily.com/1/A3_6c5d54b3a8.png\",[471],{\"_316\":415,\"_11\":65,\"_319\":64,\"_348\":416,\"_34\":350},[473,477,478],{\"_316\":474,\"_11\":475,\"_319\":476,\"_348\":349,\"_34\":350},\"w0jddsa493afvf6rc1oeyxxr\",\"Baidu\",\"baidu\",{\"_316\":427,\"_11\":428,\"_319\":429,\"_348\":349,\"_34\":430},{\"_316\":479,\"_11\":480,\"_319\":481,\"_348\":349,\"_34\":350},\"am8kdhkyb01i2uiwlomo5wni\",\"office tool\",\"office-tool\",[],\"2026-08-28T01:48:42.611Z\",\"2026-08-28T01:49:02.956Z\",\"2026-08-28T01:49:02.991Z\",{\"_316\":487,\"_129\":488,\"_319\":489,\"_321\":490,\"_323\":491,\"_325\":410,\"_327\":383,\"_329\":330,\"_331\":411,\"_333\":334,\"_6\":7,\"_335\":-5,\"_336\":-5,\"_337\":492,\"_56\":493,\"_342\":496,\"_364\":509,\"_366\":-5,\"_367\":-5,\"_368\":510,\"_370\":511,\"_372\":512},\"k41q9vhv5unni1p3lrbvyshg\",\"XPeng's Second-Gen VLA Adds 'Time,' Pushing Physical AI From 3D Space to 4D Spacetime\",\"xpeng-second-gen-vla-time\",\"XPeng debuts the first major upgrade to its second-generation VLA, adding dynamic 4D spacetime understanding and bringing Robotaxi-grade L4 behavior to production cars.\",\"\u003cp\u003eXPeng has delivered the biggest upgrade yet to its second-generation Vision-Language-Action model, and the core change is deceptively simple: the AI now understands time. At a 'TIME'-themed physical-AI showcase, the company said its foundation model has climbed from static 3D spatial understanding to dynamic 4D spacetime understanding, with the new XOS 6.3.0 software debuting globally on the G9L.\u003c/p\u003e\\n\u003cp\u003eThree technologies anchor the leap. Infini-VLA, a long-horizon architecture, remembers up to 30 seconds of road scene, stitching continuous driving events into a coherent temporal understanding. Streaming Inference shifts the model from discrete reasoning to continuous, parallel processing, cutting end-to-end response latency by 300%. X-Foresight, a predictive world model, anticipates the behavior of surrounding traffic participants up to six seconds ahead, sharpening reactions to sudden cut-ins and hard braking. On-device parameters grew 3.5 times — more than 15 times that of mainstream VLA models — and comprehensive multi-dimensional safety improved 20-fold.\u003c/p\u003e\\n\u003cp\u003eXPeng also introduced Master Agent, a vehicle-agnostic 'brain' built on its Omni multimodal model that fuses VLA perception with the VLM cockpit, automatically decomposing user intent and coordinating autonomous driving, chassis and cabin systems. New voice-activated features, such as requesting a pull-over by voice, effectively bring Robotaxi-grade L4 capability into mass-production vehicles.\u003c/p\u003e\\n\u003cp\u003eThe upgrade arrives as XPeng doubles down on physical AI more broadly. Its robotics business recently closed a first private round of more than $900 million at a valuation above $6.3 billion — a record for a single round in China's embodied-intelligence sector — with backing that includes IDG, Gaorong, Tencent and Alibaba.\u003c/p\u003e\\n\u003cp\u003eFor XPeng, the ambition is a unified physical world model that treats driving, robots and cabin intelligence as one continuous, time-aware reasoning problem rather than separate point tasks. By encoding time into the model, it is betting that the next leap in autonomy looks less like sensing and more like understanding the world as it unfolds.\u003c/p\u003e\",\"https://cms-image.pandaily.com/1/A2_bcdb7bfbc3.png\",[494],{\"_316\":495,\"_11\":73,\"_319\":72,\"_348\":416,\"_34\":350},\"sxqv5wtxm67bt4hbdptijger\",[497,501,505],{\"_316\":498,\"_11\":499,\"_319\":500,\"_348\":349,\"_34\":350},\"a27csecjx8sqir4b4lif5rua\",\"XPeng Motors\",\"xpeng-motors\",{\"_316\":502,\"_11\":503,\"_319\":504,\"_348\":349,\"_34\":-5},\"movepp1qjv73p1b86n3pi91s\",\"VLA\",\"vla\",{\"_316\":506,\"_11\":507,\"_319\":508,\"_348\":349,\"_34\":350},\"la9w1kj8q5529bq46ko354xd\",\"Autonomous Driving\",\"autonomous-driving\",[],\"2026-08-28T01:48:41.457Z\",\"2026-08-28T01:49:02.029Z\",\"2026-08-28T01:49:02.066Z\",\"isDraft\",\"actionData\",\"errors\"]\n");</script><!--$--><script>window.__remixContext.streamController.close();</script><!--/$--><!--/$-->
